<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>資產配置與記帳簿</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    .summary-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .summary-card .label { font-size: 13px; color: var(--text-sub); }
    .summary-card .val-large { font-size: 28px; font-weight: 800; color: var(--primary); margin: 6px 0 12px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .summary-grid .sub-val { font-size: 15px; font-weight: 700; margin-top: 3px; }
    
    .status-banner {
      background: #fffbeb;
      border: 1px solid var(--warning);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #b45309;
      margin-bottom: 16px;
      display: none;
    }

    .btn-group { display: flex; gap: 8px; margin-bottom: 16px; }
    button {
      flex: 1;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; padding: 5px 9px; font-size: 12px; border-radius: 6px; }
    .btn-edit { background: #f1f5f9; color: var(--text); padding: 5px 9px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .control-row select, .search-input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .search-box {
      margin-bottom: 12px;
      display: flex;
      gap: 6px;
    }
    .search-input {
      flex: 1;
      text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    
    .item-title-tw { font-size: 13.5px; font-weight: 700; color: #475569; }
    .item-title-other { font-size: 15px; font-weight: 700; color: #1e293b; }
    .item-cname { font-size: 15px; font-weight: 700; color: var(--primary); margin-left: 6px; }
    .item-subtag { font-size: 12px; font-weight: 600; color: #4338ca; background: #e0e7ff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }

    .item-market { font-size: 11px; padding: 1px 5px; background: #e2e8f0; border-radius: 4px; margin-left: 4px; }
    .item-data { display: flex; justify-content: space-between; margin-top: 5px; font-size: 13px; }
    .item-meta { font-size: 11px; color: var(--text-sub); margin-top: 8px; line-height: 1.4; border-top: 1px dashed var(--border); padding-top: 5px; }

    .badge-warn { color: var(--warning); font-weight: 600; }
    .badge-ok { color: var(--success); font-weight: 700; }
    .badge-muted { color: var(--text-sub); font-weight: 600; }
    .profit-up { color: #dc2626; font-weight: 700; }
    .profit-down { color: #16a34a; font-weight: 700; }

    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none; justify-content: center; align-items: flex-end; z-index: 99;
    }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px 16px 0 0;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="statusBanner" class="status-banner"></div>

  <!-- 總覽看板 -->
  <div class="summary-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="label" id="netAssetLabel">淨資產 (TWD)</div>
      <label style="font-size: 12px; font-weight: 600; color: #dc2626; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="excludeQQQI" onchange="renderUI()"> 排除 QQQI 試算
      </label>
    </div>
    <div class="val-large" id="netAssetDisplay">$0</div>
    
    <div class="summary-grid">
      <div>
        <div class="label">總資產</div>
        <div class="sub-val" id="totalAssetDisplay">$0</div>
      </div>
      <div>
        <div class="label">總負債</div>
        <div class="sub-val" id="debtAssetDisplay">$0</div>
      </div>
    </div>
    
    <!-- 預估明年配息與總平均殖利率 -->
    <div class="summary-grid" style="margin-top: 8px;">
      <div>
        <div class="label">預估明年現金配息</div>
        <div class="sub-val badge-ok" id="estimatedDividendDisplay">$0</div>
      </div>
      <div>
        <div class="label">總平均現金殖利率</div>
        <div class="sub-val badge-ok" id="portfolioYieldDisplay">0.00%</div>
      </div>
    </div>

    <!-- Beta 區間統計一：0 < Beta < 1 及 1 <= Beta < 2 -->
    <div class="summary-grid" style="margin-top: 8px;">
      <div>
        <div class="label">0 &lt; Beta &lt; 1 金額</div>
        <div class="sub-val" id="beta0to1Display">$0</div>
      </div>
      <div>
        <div class="label">1 ≤ Beta &lt; 2 金額</div>
        <div class="sub-val" id="beta1to2Display">$0</div>
      </div>
    </div>

    <!-- Beta 區間統計二：Beta >= 2 及 類現金 (Beta = 0) -->
    <div class="summary-grid" style="margin-top: 8px;">
      <div>
        <div class="label">Beta ≥ 2 金額 (槓桿)</div>
        <div class="sub-val" id="betaGte2Display">$0</div>
      </div>
      <div>
        <div class="label">類現金 (Beta=0)</div>
        <div class="sub-val" id="cashLikeTotalDisplay">$0</div>
      </div>
    </div>

    <!-- 組合 Beta 與整體報酬表現 -->
    <div class="summary-grid" style="margin-top: 8px;">
      <div>
        <div class="label">資產組合加權 Beta</div>
        <div class="sub-val" id="portfolioBetaDisplay">0.00</div>
      </div>
      <div>
        <div class="label">資產整體報酬表現</div>
        <div class="sub-val" id="portfolioReturnDisplay">--</div>
      </div>
    </div>

    <div style="font-size: 11px; color: var(--text-sub); margin-top: 10px;" id="fxRateInfo">
      匯率資訊：載入中...
    </div>
  </div>

  <!-- 操作按鈕 -->
  <div class="btn-group">
    <button class="btn-primary" onclick="refreshQuotes()">更新價格</button>
    <button class="btn-outline" onclick="openModal('addAssetModal')">新增項目</button>
    <button class="btn-outline" onclick="openModal('backupModal')">備份/還原</button>
  </div>

  <!-- 代號快速檢索框 -->
  <div class="search-box">
    <input type="text" id="searchKeyword" class="search-input" placeholder="🔍 快速檢索代號/種類 (例: 00662, 活存, 房貸)" oninput="renderUI()">
    <button class="btn-edit" style="flex:none; padding:8px 12px;" onclick="clearSearch()">清除</button>
  </div>

  <!-- 控制列：排序與報酬基準 -->
  <div class="control-row">
    <div>
      <span style="font-size: 12px; color: var(--text-sub);">排序：</span>
      <select id="sortOption" onchange="renderUI()">
        <option value="DEFAULT">預設順序</option>
        <option value="AMOUNT_DESC">金額 (高至低)</option>
        <option value="QTY_DESC">股數 (多至少)</option>
        <option value="MARKET_TW_FIRST">台股優先</option>
        <option value="MARKET_US_FIRST">美股優先</option>
      </select>
    </div>
    <div>
      <span style="font-size: 12px; color: var(--text-sub);">基準：</span>
      <select id="returnBenchmark" onchange="renderUI()">
        <option value="1D">前一日</option>
        <option value="1M">前一個月</option>
        <option value="1Y">前一年</option>
      </select>
    </div>
  </div>

  <!-- 明細列表 -->
  <div id="assetList"></div>

  <div class="footer-note">
    💡 提示：點擊各標的下方「手動微調」即可同時修改股數/金額、子種類與報價指標。
  </div>
</div>

<!-- 新增資產 Modal -->
<div id="addAssetModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-bottom: 16px;">新增項目</h3>
    <div class="form-group">
      <label>類別</label>
      <select id="itemType" onchange="toggleFormType()">
        <option value="STOCK">股票 / ETF</option>
        <option value="CASH">現金</option>
        <option value="DEBT">負債</option>
      </select>
    </div>

    <!-- 股票欄位 -->
    <div id="stockFields">
      <div class="form-group">
        <label>市場</label>
        <select id="stockMarket">
          <option value="TW">台股 (上市/上櫃)</option>
          <option value="US">美股 (US)</option>
          <option value="HK">港股 (HK)</option>
        </select>
      </div>
      <div class="form-group">
        <label>代號 (例: 00662, 00696B, QQQ, QQQI, 2834)</label>
        <input type="text" id="stockSymbol" placeholder="請輸入代號" style="text-transform: uppercase;">
      </div>
      <div class="form-group">
        <label>持有股數 (股)</label>
        <input type="number" step="any" id="stockQty" placeholder="0">
      </div>
    </div>

    <!-- 現金 / 負債欄位 (加入子項目種類) -->
    <div id="fiatFields" style="display: none;">
      <div class="form-group">
        <label id="fiatCategoryLabel">種類 / 說明 (例如: 活存、定存、交割戶、房貸)</label>
        <input type="text" id="fiatSubCategory" placeholder="例如: 銀行活存、房貸、信貸" list="categoryPresets">
        <datalist id="categoryPresets">
          <option value="活存">
          <option value="定存">
          <option value="證券交割戶">
          <option value="緊急備用金">
          <option value="房屋貸款">
          <option value="信用貸款">
          <option value="質押借券">
          <option value="信用卡分期">
        </datalist>
      </div>
      <div class="form-group">
        <label>幣別</label>
        <select id="fiatCurrency">
          <option value="TWD">新台幣 (TWD)</option>
          <option value="USD">美元 (USD)</option>
          <option value="HKD">港幣 (HKD)</option>
        </select>
      </div>
      <div class="form-group">
        <label>金額</label>
        <input type="number" step="any" id="fiatAmount" placeholder="0">
      </div>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
      <button class="btn-outline" onclick="closeModal('addAssetModal')">取消</button>
      <button class="btn-primary" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<!-- 手動微調 Modal -->
<div id="manualPriceModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-bottom: 16px;" id="manualModalTitle">手動微調項目</h3>
    <input type="hidden" id="manualAssetId">
    <input type="hidden" id="manualQuoteKey">

    <!-- 現金/負債子項目種類修改 -->
    <div class="form-group" id="manualSubCategoryGroup" style="display: none;">
      <label>種類 / 說明</label>
      <input type="text" id="manualSubCategoryVal" placeholder="例如: 活存、房貸">
    </div>

    <div class="form-group">
      <label id="manualQtyLabel">持有數量</label>
      <input type="number" step="any" id="manualQtyVal" placeholder="請輸入數量">
    </div>

    <div id="stockManualFields">
      <div class="form-group">
        <label>收盤價 (原幣)</label>
        <input type="number" step="any" id="manualPriceVal" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Beta 值 (類現金填 0，大盤填 1.0)</label>
        <input type="number" step="any" id="manualBetaVal" placeholder="例如: 1.15">
      </div>
      <div class="form-group">
        <label>現金殖利率 (%) [不配息請填 0]</label>
        <input type="number" step="any" id="manualYieldVal" placeholder="例如: 4.5">
      </div>
      <div class="form-group">
        <label>價格日期</label>
        <input type="date" id="manualPriceDate">
      </div>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
      <button class="btn-outline" onclick="closeModal('manualPriceModal')">取消</button>
      <button class="btn-primary" onclick="saveManualPrice()">儲存套用</button>
    </div>
  </div>
</div>

<!-- 備份還原 Modal -->
<div id="backupModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-bottom: 16px;">備份與還原</h3>
    <div class="form-group">
      <button class="btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="exportJSON()">下載 JSON 備份檔</button>
    </div>
    <div class="form-group" style="margin-top: 16px;">
      <label>匯入備份 (覆蓋還原)</label>
      <input type="file" id="importFileInput" accept=".json" onchange="previewImport(event)">
    </div>
    <div id="importPreview" style="font-size: 13px; color: var(--text-sub); margin-bottom: 16px;"></div>
    <div class="btn-group">
      <button class="btn-outline" onclick="closeModal('backupModal')">關閉</button>
      <button id="btnConfirmRestore" class="btn-danger" style="display:none;" onclick="confirmRestore()">確認覆蓋還原</button>
    </div>
  </div>
</div>

<script>
// 【重要】請將此網址替換為您的 Cloudflare Worker 網址
const PROXY_BASE_URL = 'https://asset-tracker-proxy.roseleaf719.workers.dev'; 

const STORAGE_KEY = 'PORTFOLIO_LEDGER_DATA_V4';

const TW_STOCK_NAMES = {
  '00662': '富邦NASDAQ',
  '00865B': '國泰US短期公債',
  '00631L': '元大台灣50正2',
  '00696B': '富邦美債20年',
  '00679B': '元大美債20年',
  '00687B': '國泰20年美債',
  '00720B': '元大投資級公司債',
  '00751B': '元大AAA至A公司債',
  '0050': '元大台灣50',
  '0056': '元大高股息',
  '00878': '國泰永續高股息',
  '00919': '群益台灣精選高息',
  '00929': '復華台灣科技優息',
  '00940': '元大台灣價值高息',
  '00670L': '富邦NASDAQ正2',
  '00675L': '富邦臺灣加權正2',
  '2330': '台積電',
  '2317': '鴻海',
  '2454': '聯發科',
  '2308': '台達電'
};

let state = {
  assets: [],       
  quotes: {},       
  fxRates: {
    USD: { rate: null, date: null },
    HKD: { rate: null, date: null }
  }
};

let importStagingData = null;

window.addEventListener('DOMContentLoaded', () => {
  loadFromLocal();
  renderUI();
  refreshQuotes(true);
});

function loadFromLocal() {
  const local = localStorage.getItem(STORAGE_KEY);
  if (local) {
    try {
      const parsed = JSON.parse(local);
      state = { ...state, ...parsed };
    } catch (e) {
      console.error("Local data parse error", e);
    }
  }
}

function saveToLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function toggleFormType() {
  const type = document.getElementById('itemType').value;
  document.getElementById('stockFields').style.display = (type === 'STOCK') ? 'block' : 'none';
  document.getElementById('fiatFields').style.display = (type !== 'STOCK') ? 'block' : 'none';
  if (type !== 'STOCK') {
    document.getElementById('fiatCategoryLabel').innerText = (type === 'CASH') ? '現金種類 (例: 活存、定存、交割戶)' : '負債種類 (例: 房貸、信貸、質押)';
  }
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function clearSearch() {
  document.getElementById('searchKeyword').value = '';
  renderUI();
}

function saveItem() {
  const type = document.getElementById('itemType').value;
  const id = Date.now().toString();

  if (type === 'STOCK') {
    const market = document.getElementById('stockMarket').value;
    let symbol = document.getElementById('stockSymbol').value.trim().toUpperCase();
    const qty = parseFloat(document.getElementById('stockQty').value);

    if (!symbol || isNaN(qty) || qty <= 0) {
      alert('請填寫有效代號與大於 0 的股數');
      return;
    }
    state.assets.push({ id, type, market, symbol, qty });
  } else {
    const currency = document.getElementById('fiatCurrency').value;
